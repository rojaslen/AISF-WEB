<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <a href="{{ '/' | relative_url }}" class="site-brand">
      {% if site.logo %}
      <img src="{{ site.logo | relative_url }}" alt="{{ site.title }} logo" class="site-logo">
      {% endif %}
      <span class="site-name">{{ site.title }}</span>
    </a>
  </header>
  <main id="main-content">
    <a name="main-content"></a>
    {{ content }}
  </main>
  <footer>
    <p>{{ site.footer_content }}</p>
  </footer>

  <dialog class="lightbox" id="lightbox" aria-label="Full-size image">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close">&#215;</button>
    <img src="" alt="" class="lightbox-img" id="lightbox-img">
  </dialog>

  <script>
  (function () {
    var dialog = document.getElementById('lightbox');
    var img    = document.getElementById('lightbox-img');
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('.thumb-btn');
      if (btn) { img.src = btn.dataset.src; img.alt = btn.dataset.alt; dialog.showModal(); }
    });
    dialog.addEventListener('click', function (e) {
      if (e.target === dialog || e.target.id === 'lightbox-close') { dialog.close(); }
    });
  })();
  </script>

</body>
</html>
